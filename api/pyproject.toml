[project]
name = "portal-api"
version = "0.1.0"
description = "API do Portal Capibaribe Prime (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pywebpush>=2.5.0",
    "sqlalchemy>=2",
    "vercel>=0.11.5",
]

# A Vercel procura o app ASGI aqui (runtime Python).
[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-ra"
