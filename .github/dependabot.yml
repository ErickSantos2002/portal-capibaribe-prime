# Dependências com falha conhecida ganham atualização automática (arquitetura, seção 4).
version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
