<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Fonte da imagem de prévia do link (prototipo/og.png). Gerar: node scripts/dev/gerar-og.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #1f5e3b; color: #fff; font-family: "Atkinson Hyperlegible", sans-serif;
         display: flex; align-items: center; gap: 72px; padding: 0 96px; box-sizing: border-box; position: relative; overflow: hidden; }
  body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #e8b22a; }
  .placa { flex: none; display: flex; flex-direction: column; align-items: center; border: 7px solid #fff; border-radius: 22px;
           padding: 22px 46px 28px; line-height: 1; box-shadow: inset 0 -12px 0 #e8b22a; }
  .placa small { font-size: 40px; font-weight: 700; letter-spacing: .02em; }
  .placa strong { font-size: 150px; font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .selo { display: inline-block; background: #e8b22a; color: #17231c; font-weight: 700; font-size: 26px; padding: 8px 18px; border-radius: 999px; }
  h1 { font-size: 76px; line-height: 1.02; margin: 22px 0 18px; }
  p { font-size: 32px; line-height: 1.3; margin: 0; color: #e3eee6; }
</style></head>
<body>
  <div class="placa"><small>Bloco 1</small><strong>101</strong></div>
  <div>
    <span class="selo">Protótipo para testar</span>
    <h1>Portal Capibaribe Prime</h1>
