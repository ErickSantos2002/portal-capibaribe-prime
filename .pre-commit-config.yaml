# Checagens que rodam sozinhas a cada commit. Instalar o gancho uma vez por clone:
#   pre-commit install
# Rodar em tudo, sem commitar:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
        # tsconfig aceita comentários (JSONC), que o check-json recusa; o tsc confere esses.
        exclude: ^web/tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      # Segredo (chave de API, token, senha) não sai da máquina.
      # Usa o gitleaks do sistema (pacman -S gitleaks).
      - id: gitleaks
        name: gitleaks (segredos)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false

      # Python da API: o ruff vem do uv.lock (mesma versão do CI e do Dependabot).
      # `format` conserta sozinho; o commit para e é só adicionar de novo.
      - id: ruff-format
        name: ruff format (api)
        entry: uv run --directory api --frozen ruff format .
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check (api)
        entry: uv run --directory api --frozen ruff check .
        language: system
        files: ^api/.*\.py$
        pass_filenames: false

      # Front (web/): ESLint e checagem de tipos com as versões do package-lock.json.
      # Requer `npm ci --prefix web` uma vez por clone.
      - id: eslint
        name: eslint (web)
        entry: npm --prefix web run --silent lint
        language: system
        files: ^web/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: tsc
        name: tsc (web)
        entry: npm --prefix web run --silent typecheck
        language: system
        files: ^web/(.*\.(ts|tsx)|tsconfig.*\.json|package(-lock)?\.json)$
        pass_filenames: false

      # Mudou o protótipo? Roda o teste no Chrome; falha barra o commit.
      - id: testar-prototipo
        name: teste do protótipo
        entry: node scripts/dev/testar-prototipo.mjs
        language: system
        files: ^(prototipo/index\.html|scripts/dev/testar-prototipo\.mjs)$
        pass_filenames: false
